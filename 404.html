    <script>
      // Pre-paint locale hint — set <html lang> to match the user's actual
      // preference before React boots. Helps accessibility (screen readers,
      // CSS :lang() selectors) and lets the browser pick correct font
      // fallbacks from the first paint. Must stay tiny — runs synchronously
      // and blocks paint.
      (() => {
        try {
          const stored = localStorage.getItem('locale');
          const locale =
            stored ||
            (navigator.language && navigator.language.toLowerCase().indexOf('zh') === 0
              ? 'zh-CN'
              : 'en');
          if (locale !== document.documentElement.lang) {
            document.documentElement.lang = locale;
          }
        } catch {
          /* leave default `lang="zh-CN"` */
        }
      })();
    </script>
